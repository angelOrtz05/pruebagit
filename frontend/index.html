<!DOCTYPE html>
<html>
<head>
    <title>Bicicletas</title>
</head>
<body>
    <h1>Consultar bicicleta</h1>
    <input type="number" id="idBiciConsulta" placeholder="ID de la bici">
    <button onclick="buscarBici()">Buscar</button>
    <p id="resultadoConsulta"></p>

    <script>
        function buscarBici() {
            const id = document.getElementById("idBiciConsulta").value;

            fetch(`http://127.0.0.1:8000/bicicletas/${id}`)
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById("resultadoConsulta").innerText =
                        `Tipo: ${datos.tipo}, Estado: ${datos.estado}, Contador de uso: ${datos.contador_uso}`;
                });
        }
    </script>
    <h1>Consultar lista de bicicletas</h1>
    <button onclick="listarBicicletas()">Listar</button>
    <p id="resultadoLista"></p>
    <script>
        function listarBicicletas() {
            fetch(`http://127.0.0.1:8000/bicicletas`)
                .then(respuesta => respuesta.json())
                .then(datos => {
                    let texto = "";
                    for (const bici of datos) {
                        texto += `${bici.id_bici} - ${bici.tipo} - ${bici.estado} - Usos: ${bici.contador_uso}\n`;
                    }
                    document.getElementById("resultadoLista").innerText = texto;
                });
        }  
    </script>
    
    
    <h1>Crear una nueva renta</h1>
    <input type="text" id="idsBicis" placeholder="IDs de las bicicletas (separados por comas)">
    <input type="number" id="idCliente" placeholder="ID del cliente">
    <input type="text" id="duracion" placeholder="Duracion pagada">

    <button onclick="crearRenta()">Crear renta</button>
    <p id="resultadoRenta"></p>
    <script>
        function crearRenta() {    
            const bicicletasTexto = document.getElementById("idsBicis").value; // "1,3"
            const bicicletasArray = bicicletasTexto.split(",").map(Number);     // [1, 3]
            fetch("http://127.0.0.1:8000/rentas", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    id_cliente: Number(document.getElementById("idCliente").value),
                    duracion_pagada: document.getElementById("duracion").value,
                    bicicletas: bicicletasArray
                })
            })
                .then(respuesta => respuesta.json())
                .then(datos => {
                    document.getElementById("resultadoRenta").innerText =
                        `Renta creada: ${datos.id_renta}`;
                });
        }
    </script>
</body>
</html>
